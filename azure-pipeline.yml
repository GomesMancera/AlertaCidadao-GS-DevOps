# Azure Pipelines — CI + CD AlertaCidadao (GS DevOps 2026/2)
trigger:
  branches:
    include:
      - main
pr: none

pool:
  name: Default

variables:
  - group: alerta-gs-vars
  - name: webAppName
    value: app-alerta-gs555427
  - name: resourceGroup
    value: rg-alerta-gs-devops
  - name: azureServiceConnection
    value: azure-alerta-sc

stages:
  - stage: Build
    displayName: "CI — Build, Testes e Artefatos"
    jobs:
      - job: BuildTest
        displayName: Maven Build + Unit Tests
        steps:
          # Script (evita demand "maven" do task Maven@4 no agent self-hosted)
          - task: PowerShell@2
            displayName: mvn test package
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"
                $env:JAVA_HOME = "C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot"
                $mvn = "C:\Users\mance\tools\apache-maven-3.9.9\bin\mvn.cmd"
                & $mvn -B test package
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          - task: PublishTestResults@2
            displayName: Publish Surefire results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
              failTaskOnFailedTests: true

          - task: CopyFiles@2
            displayName: Stage JAR
            inputs:
              contents: "target\\*.jar"
              targetFolder: "$(Build.ArtifactStagingDirectory)\\app"
              flattenFolders: true

          - task: CopyFiles@2
            displayName: Stage scripts
            inputs:
              sourceFolder: scripts
              contents: "**"
              targetFolder: "$(Build.ArtifactStagingDirectory)\\scripts"

          - task: PublishBuildArtifacts@1
            displayName: Publish drop
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)"
              artifactName: drop

  - stage: Release
    displayName: "CD — Deploy Azure App Service"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployWebApp
        displayName: Deploy JAR to App Service
        steps:
          - download: current
            artifact: drop
          - task: PowerShell@2
            displayName: Rename boot JAR to app.jar
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"
                $src = Get-ChildItem "$(Pipeline.Workspace)\drop\app\*.jar" |
                  Where-Object { $_.Name -ne "app.jar" -and $_.Name -notlike "*.original" } |
                  Select-Object -First 1
                if (-not $src) { throw "Boot JAR not found in drop/app" }
                Copy-Item $src.FullName "$(Pipeline.Workspace)\drop\app\app.jar" -Force
                Write-Host "Prepared $($src.Name) as app.jar"
          - task: AzureCLI@2
            displayName: Clear custom startup command
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                $sub = az account show --query id -o tsv
                $bodyPath = Join-Path $env:AGENT_TEMPDIRECTORY "clear-startup.json"
                Set-Content -Path $bodyPath -Value '{"properties":{"appCommandLine":""}}' -Encoding ascii
                az rest --method patch --uri "https://management.azure.com/subscriptions/$sub/resourceGroups/$(resourceGroup)/providers/Microsoft.Web/sites/$(webAppName)/config/web?api-version=2023-01-01" --headers "Content-Type=application/json" --body "@$bodyPath"
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          - task: AzureWebApp@1
            displayName: Azure Web App Deploy
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              appType: webAppLinux
              appName: "$(webAppName)"
              resourceGroupName: "$(resourceGroup)"
              package: "$(Pipeline.Workspace)\\drop\\app\\app.jar"
              runtimeStack: "JAVA|21-java21"
